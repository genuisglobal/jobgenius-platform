name: Scheduled Jobs

on:
  # Every 5 minutes: ops alerts
  schedule:
    - cron: "*/5 * * * *"
    # Every 15 minutes: outreach scheduler
    - cron: "*/15 * * * *"
    # Daily retention (03:00 UTC)
    - cron: "0 3 * * *"
    # Daily intelligence feedback loop (05:00 UTC)
    - cron: "0 5 * * *"
    # Daily client match cleaner — removes matches older than 1 week (04:00 UTC)
    - cron: "0 4 * * *"
    # Daily QA sampling — first-3-per-seeker + 5% of completed runs (06:30 UTC)
    - cron: "30 6 * * *"
    # Weekly client report drafts — Fridays 14:00 UTC, ready for AM review
    - cron: "0 14 * * 5"
    # Weekly AM productivity digest — Fridays 16:00 UTC (17:00 WAT, end of day)
    - cron: "0 16 * * 5"
    # Hourly sweep for shifts left open past 10 hours — nobody is auto-signed out
    - cron: "0 * * * *"
    # Daily follow-up drafts — day-3/7 bumps for applied-no-response (07:00 UTC)
    - cron: "0 7 * * *"
    # Daily outcome rollup — application→interview conversion tracking (07:30 UTC)
    - cron: "30 7 * * *"
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  ops-alerts:
    name: Ops Alerts
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call ops alerts endpoint
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/alerts/run"

  background-jobs:
    name: Background Jobs
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call background jobs endpoint
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/background/run?limit=10"

  queue-sweeper:
    name: Queue Sweeper
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Sweep orphaned queue items and kick background worker
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/queue/sweep"
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/background/run?limit=10"

  outreach-scheduler:
    name: Outreach Scheduler
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call outreach scheduler endpoint
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/outreach/scheduler/run"

  retention:
    name: Retention Cleanup
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call retention endpoint
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/retention/run"

  gmail-inbox-scan:
    name: Gmail Inbox Scan
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Scan Gmail inboxes
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/gmail/scan"

  intelligence-feedback:
    name: Intelligence Feedback Loop
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call intelligence endpoint
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/intelligence/run"

  clean-client-matches:
    name: Clean Client Matches
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Remove matches older than 1 week (applied jobs are saved for their assets first)
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/clean-matches?max_age_days=7"

  qa-sample:
    name: QA Sampling
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Sample completed runs into the QA review queue
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/qa-sample"

  client-reports:
    name: Weekly Client Report Drafts
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Draft weekly activity reports for active clients
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/client-reports"

  long-shift-alerts:
    name: Long-Running Shift Alerts
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Nudge workers at 9h and escalate to people managers at 10h
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/long-shifts"

  productivity-digest:
    name: Weekly AM Productivity Digest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Send each AM their own week of productivity numbers
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/productivity-digest"

  follow-up-drafts:
    name: Follow-up Drafts
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Draft day-3/7 follow-ups for applied-no-response runs
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/follow-ups"

  outcomes-rollup:
    name: Outcome Rollup
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh application_outcomes (application→interview conversion)
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -fsSL -X POST -H "x-ops-key: ${OPS_API_KEY}" "${WEB_BASE_URL}/api/ops/outcomes-rollup"
